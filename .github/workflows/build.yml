name: Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: 2.12.3
  LINUX_DEPS: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    - name: Linux build dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - uses: Swatinem/rust-cache@v2

    - name: Version matches the tag
      if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux'
      run: |
        version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "discord-auto-mute") | .version')
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match the Cargo version $version"
          exit 1
        fi

    - name: Format
      if: runner.os == 'Linux'
      run: cargo fmt --all --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Tests
      run: cargo test --workspace

  # Installers to try (every push), and the release assets (version tags), which are
  # signed for the updater with the secrets TAURI_SIGNING_PRIVATE_KEY [+ _PASSWORD].
  bundle:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
    steps:
    - uses: actions/checkout@v7

    - name: Linux build dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Bundle
      shell: bash
      run: |
        if [ "$RELEASE" = true ]; then
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is missing"
            exit 1
          fi
          npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" build
        else
          echo '{"bundle": {"createUpdaterArtifacts": false}}' > "$RUNNER_TEMP/no-updater.json"
          npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" build --config "$RUNNER_TEMP/no-updater.json"
        fi
        mkdir dist
        # Renamed after copying: the updater signature does not depend on the file name.
        copy() { cp "$1" "dist/$2"; if [ -f "$1.sig" ]; then cp "$1.sig" "dist/$2.sig"; fi; }
        if [ "$RUNNER_OS" = Windows ]; then
          copy "$(ls target/release/bundle/nsis/*-setup.exe)" Discord_Auto-Mute_Setup.exe
        else
          copy "$(ls target/release/bundle/deb/*.deb)" discord-auto-mute_amd64.deb
          copy "$(ls target/release/bundle/appimage/*.AppImage)" Discord_Auto-Mute_amd64.AppImage
        fi

    - uses: actions/upload-artifact@v7
      with:
        name: bundle-${{ runner.os }}
        path: dist/*
        if-no-files-found: error

  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # create the GitHub release
    steps:
    - uses: actions/download-artifact@v7
      with:
        pattern: bundle-*
        merge-multiple: true
        path: dist

    # latest.json is read by the application's updater (plugins.updater.endpoints).
    - name: Checksums and updater manifest
      working-directory: dist
      run: |
        sha256sum Discord_Auto-Mute_Setup.exe discord-auto-mute_amd64.deb Discord_Auto-Mute_amd64.AppImage > SHA256SUMS.txt
        base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
        jq -n \
          --arg version "${GITHUB_REF_NAME#v}" \
          --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --arg notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
          --arg win_sig "$(cat Discord_Auto-Mute_Setup.exe.sig)" --arg win_url "$base/Discord_Auto-Mute_Setup.exe" \
          --arg linux_sig "$(cat Discord_Auto-Mute_amd64.AppImage.sig)" --arg linux_url "$base/Discord_Auto-Mute_amd64.AppImage" \
          '{version: $version, notes: $notes, pub_date: $date, platforms: {
             "windows-x86_64": {signature: $win_sig, url: $win_url},
             "linux-x86_64": {signature: $linux_sig, url: $linux_url}}}' > latest.json
        rm -f *.sig
        cat latest.json SHA256SUMS.txt

    - uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        generate_release_notes: true
        body: |
          ## Installation
          **Windows:** download `Discord_Auto-Mute_Setup.exe` and run it.
          **Linux (x86_64):** `discord-auto-mute_amd64.deb` (Debian, Ubuntu) or `Discord_Auto-Mute_amd64.AppImage`.
          On Linux, add your user to the `input` group so the keys can be read: `sudo usermod -aG input $USER`, then log out and back in.

          The Windows setup is not code signed: on a first download, SmartScreen may ask you to click **More info › Run anyway**. Then the application updates itself (Windows and AppImage): updates are checked against the project's update key.
          Verify the download with `SHA256SUMS.txt`.
